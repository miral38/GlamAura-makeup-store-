    .btn-pink:hover { background-color: #e03e5b; color: white; }
    .btn-outline-pink { border: 1px solid #ff4d6d; color: #ff4d6d; }

<body>

<nav class="navbar navbar-light bg-white shadow-sm">

    <a class="navbar-brand logo" href="index.html">GlamAura</a>

      <div style="position:relative; cursor:pointer;" onclick="window.location.href='wishlist.html'">
        <i class="bi bi-heart fs-4 mx-3"></i>
        <span id="wishlistCount" style="position:absolute; top:-6px; right:-10px; background:#e91e63; color:white; font-size:12px; padding:2px 6px; border-radius:50%; display:none">0</span>
      </div>
      <div style="position:relative; cursor:pointer;" onclick="window.location.href='cart.html'">
        <i class="bi bi-cart fs-4 mx-3"></i>
        <span id="cartCount" style="position:absolute; top:-6px; right:-10px; background:#e91e63; color:white; font-size:12px; padding:2px 6px; border-radius:50%; display:none">0</span>
      </div>
    </div>
  </div>
</nav>

    Kiko: [
      { name: "lip gloss", price: 4800, img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTweKJpFFnxbFGTekuMqlxmoBkmQDkxGtPZtg&s" },
      { name: "Foundation", price: 9700, img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSdq1vL7s8Ld6DVyf8dZKlWW5K-RZ4IxNZneg&s"},
      { name: "Blush", price: 6200, img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQH7zGJtzSFewCaSsN_JUpIBAxdAbRV5tSgNw&s"},
      { name: "Primer", price: 8200, img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcROYqPL4kBg8QX78QLJMDjJ2S7LcVHCgt2rKQ&s"},

    ]
  };

  // ---------------- CART & WISHLIST ----------------
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

  function updateCounts() {
    const cartBadge = document.getElementById("cartCount");
    const wishlistBadge = document.getElementById("wishlistCount");
    if(cartBadge){cartBadge.innerText = cart.length; cartBadge.style.display = cart.length>0?"inline-block":"none";}
    if(wishlistBadge){wishlistBadge.innerText = wishlist.length; wishlistBadge.style.display = wishlist.length>0?"inline-block":"none";}
  }
  updateCounts();

  function addToCart(name, price, img) {
    cart.push({name, price, img});
    localStorage.setItem("cart", JSON.stringify(cart));
    updateCounts();
    alert("✅ Product added to cart!");
  }

  function addToWishlist(name, price, img) {
    if(!wishlist.find(p => p.name === name)){
      wishlist.push({name, price, img});
      localStorage.setItem("wishlist", JSON.stringify(wishlist));
      updateCounts();
      alert("💖 Product added to wishlist!");
    } else {
      alert("💖 Already in wishlist!");
    }
  }

  // ---------------- SHOW BRAND PRODUCTS ----------------
  const brandParam = new URLSearchParams(window.location.search).get("brand");
  const brandTitleElem = document.getElementById("brandTitle");
  const productsDiv = document.getElementById("products");

  if(brandParam && productsDiv){
    const brandKey = Object.keys(productsData).find(key => key.toLowerCase() === brandParam.toLowerCase());

    if(brandKey){
      const products = productsData[brandKey];
      brandTitleElem.innerText = brandKey.charAt(0).toUpperCase() + brandKey.slice(1) + " Products";

      products.forEach(p => {
        const col = document.createElement("div");
        col.className = "col-md-3 mb-4";
        col.innerHTML = `
          <div class="card product-card text-center">
            <img src="${p.img}" class="card-img-top product-img">
            <div class="card-body">
              <h6>${p.name}</h6>
              <p class="price">PKR ${p.price}</p>
              <button class="btn btn-pink w-100 mb-1" onclick="addToCart('${p.name}', ${p.price}, '${p.img}')">Add to Cart</button>
              <button class="btn btn-outline-pink w-100" onclick="addToWishlist('${p.name}', ${p.price}, '${p.img}')">💖 Wishlist</button>
            </div>
          </div>
        `;
        productsDiv.appendChild(col);
      });

    } else {
      brandTitleElem.innerText = "No products available for this brand.";
    }
  }
</script>
</body>
</html>
