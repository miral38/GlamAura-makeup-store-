<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Cart | GlamAura</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-light bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand logo" href="index.html">GlamAura</a>
    <a href="brands.html" class="text-decoration-none">← Continue Shopping</a>
  </div>
</nav>

<!-- CART SECTION -->
<div class="container my-5">
  <h3 class="mb-4">🛒 Your Shopping Cart</h3>

  <!-- CART ITEMS -->
  <div id="cartItems"></div>

  <!-- TOTAL -->
  <h5 class="mt-4">
    Total: PKR <span id="totalPrice">0</span>
  </h5>

  <hr>

  <!-- CHECKOUT FORM -->
  <h4 class="mt-4">Checkout Details</h4>

  <form id="checkoutForm">
    <div class="row g-3">

      <!-- NAME -->
      <div class="col-md-6">
        <input type="text" class="form-control"
               placeholder="Full Name"
               required>
      </div>

      <!-- PHONE (11 DIGITS VALIDATION) -->
      <div class="col-md-6">
        <input type="tel" class="form-control"
               placeholder="03XXXXXXXXX"
               pattern="[0-9]{11}"
               title="Enter exactly 11 digits"
               required>
      </div>

      <!-- EMAIL -->
      <div class="col-md-6">
        <input type="email" class="form-control"
               placeholder="Email Address"
               required>
      </div>

      <!-- ADDRESS -->
      <div class="col-md-6">
        <input type="text" class="form-control"
               placeholder="Delivery Address"
               required>
      </div>

      <!-- PAYMENT METHOD -->
      <div class="col-md-6">
        <select class="form-select" required>
          <option value="">Select Payment Method</option>
          <option>Cash on Delivery</option>
          <option>Easypaisa</option>
          <option>JazzCash</option>
          <option>Bank Card</option>
        </select>
      </div>

      <!-- DISCOUNT -->
      <div class="col-md-6">
        <input type="text" class="form-control"
               placeholder="Discount Code (Optional)">
      </div>

    </div>

    <!-- PLACE ORDER -->
    <button class="btn btn-pink mt-4 w-100" type="submit">
      Place Order
    </button>
  </form>

  <!-- SUCCESS MESSAGE -->
  <div id="orderMessage" class="alert alert-success mt-4 d-none">
    🎉 Thank you for shopping with GlamAura!  
    Your order has been placed successfully.
  </div>

</div>

<!-- SCRIPT -->
<script src="script.js"></script>

</body>
</html>
