<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wishlist | GlamAura</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Wishlist styles */
    #wishlistItems .cart-item {
        display: flex;
        align-items: center;
        margin-bottom: 15px;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 8px;
    }
    #wishlistItems img {
        width: 60px;
        height: 60px;
        object-fit: cover;
        margin-right: 15px;
        border-radius: 5px;
    }
    #wishlistItems button {
        min-width: 80px;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-light bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand logo" href="index.html">GlamAura</a>
    <a href="brands.html">← Continue Shopping</a>
  </div>
</nav>

<div class="container my-5">
  <h3 class="mb-4">Your Wishlist</h3>
  <div id="wishlistItems"></div>
</div>

<script>
  // ---------------- WISHLIST & CART ----------------
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

  // ---------------- CART COUNT ----------------
  function updateCartCount() {
    const badge = document.getElementById("cartCount");
    if (!badge) return;
    badge.innerText = cart.length;
    badge.style.display = cart.length > 0 ? "inline-block" : "none";
  }
  updateCartCount();

  // ---------------- ADD TO CART ----------------
  function addToCart(name, price, img) {
    cart.push({ name, price, img });
    localStorage.setItem("cart", JSON.stringify(cart));
    updateCartCount();
    alert("✅ Product added to cart!");
  }

  // ---------------- WISHLIST PAGE ----------------
  const wishDiv = document.getElementById("wishlistItems");

  function renderWishlist() {
    wishDiv.innerHTML = "";

    if (wishlist.length === 0) {
      wishDiv.innerHTML = "<p>Your wishlist is empty</p>";
      return;
    }

    wishlist.forEach((item, index) => {
      wishDiv.innerHTML += `
        <div class="cart-item">
          <img src="${item.img}">
          <div style="flex:1">
            <strong>${item.name}</strong><br>PKR ${item.price}
          </div>
          <button class="btn btn-pink btn-sm me-2"
            onclick="addToCart('${item.name}', ${item.price}, '${item.img}')">
            Add to Cart
          </button>
          <button class="btn btn-danger btn-sm"
            onclick="removeFromWishlist(${index})">
            Remove
          </button>
        </div>`;
    });
  }

  renderWishlist();

  // ---------------- REMOVE FROM WISHLIST ----------------
  window.removeFromWishlist = function(index) {
    wishlist.splice(index, 1); // remove item
    localStorage.setItem("wishlist", JSON.stringify(wishlist)); // update localStorage
    renderWishlist(); // re-render the wishlist
  }
</script>
</body>
</html>
